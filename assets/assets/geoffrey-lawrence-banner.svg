<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Geoffrey Lawrence — Cybersecurity, VAPT, SOC, Security Research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.6" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0e1030"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.95" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060c" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#04060c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glowCyan)"/>
  <rect width="1280" height="360" fill="url(#glowViolet)"/>

  <!-- network topology (right side) -->
  <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M820 80 L920 150 L1010 95 L1120 170 L1220 110"/>
    <path d="M920 150 L880 260 L1000 300 L1120 170"/>
    <path d="M1000 300 L1130 285 L1220 230 L1120 170"/>
    <path d="M1010 95 L1090 40 L1190 55 L1220 110"/>
    <path d="M880 260 L820 80" stroke-opacity="0.18"/>
    <path d="M1010 95 L1000 300" stroke="#8b5cf6" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  </g>
  <g fill="#0a1020" stroke="#22d3ee" stroke-width="1.6">
    <circle cx="820" cy="80" r="5"/>
    <circle cx="920" cy="150" r="7"/>
    <circle cx="1010" cy="95" r="5"/>
    <circle cx="1120" cy="170" r="9"/>
    <circle cx="1220" cy="110" r="5"/>
    <circle cx="880" cy="260" r="5"/>
    <circle cx="1000" cy="300" r="7"/>
    <circle cx="1130" cy="285" r="5"/>
    <circle cx="1220" cy="230" r="6"/>
    <circle cx="1090" cy="40" r="4"/>
    <circle cx="1190" cy="55" r="4"/>
  </g>
  <g fill="#8b5cf6" stroke="none">
    <circle cx="1120" cy="170" r="3.5"/>
    <circle cx="920" cy="150" r="2.5"/>
    <circle cx="1000" cy="300" r="2.5"/>
  </g>
  <!-- single pulse: the one animated network event -->
  <circle cx="1120" cy="170" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5">
    <animate attributeName="r" values="9;34" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- left fade so text stays readable -->
  <rect width="900" height="360" fill="url(#fadeLeft)"/>

  <!-- terminal line -->
  <text x="80" y="92" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">$ whoami</text>

  <!-- name -->
  <text x="80" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="3" fill="url(#nameGrad)">Geoffrey Lawrence</text>
  <rect x="82" y="188" width="120" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- positioning -->
  <text x="80" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="2" fill="#7dd3fc">Cybersecurity  ·  VAPT  ·  SOC  ·  Security Research</text>

  <!-- rotating focus line -->
  <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" fill="#a78bfa">
    <text x="80" y="285" fill="#22d3ee">&gt;</text>
    <text x="104" y="285" opacity="0">Vulnerability Assessment
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="104" y="285" opacity="0">Security Operations
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="104" y="285" opacity="0">Threat Detection
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text x="104" y="285" opacity="0">Security Research
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- bottom edge line -->
  <rect x="0" y="357" width="1280" height="3" fill="url(#rule)" opacity="0.8"/>
</svg>
